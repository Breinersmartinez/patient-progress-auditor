<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Progress Auditor - Iniciar sesión</title>
<style>
:root {
  --radius-ui: 6px;
  --lift-interactive: -1.5px;
  --lift-static: -0.75px;
  --ease-ui: 400ms ease-out;
  --press-in: 100ms;
  --shadow-rgb: 0 0 0; /* negro sobre fondos neutros */

  --color-primary: #3D5AFE;
  --on-primary: #FFFFFF;
  --color-success: #1D9E75;
  --color-danger: #E24B4A;
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --surface-raised: #FFFFFF;
  --surface-sunken: #F1F1EE;
  --text-primary: #1F1F1E;
  --text-secondary: #5F5E5A;
  --divider: rgb(0 0 0 / 0.07);
  --color-selected: color-mix(in srgb, var(--color-primary) 8%, var(--surface));
}

/* Las sombras se declaran en * y no solo en :root, para que tomen el
   --shadow-rgb del fondo donde están (probado: en :root no tiñe). */
* {
  --shadow: 0 1px 4px rgb(var(--shadow-rgb) / 0.08);
  --shadow-hover: 0 3px 10px rgb(var(--shadow-rgb) / 0.12);
  --shadow-up: 0 -1px 4px rgb(var(--shadow-rgb) / 0.08);
}

.section--lavender { background: #EEEBFA; --shadow-rgb: 34 23 79; }
.section--mint     { background: #E8F4EE; --shadow-rgb: 23 79 51; }

@media (prefers-reduced-motion: reduce) {
  :root { --lift-interactive: 0px; --lift-static: 0px; }
}

.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-ui);
  font: inherit; font-weight: 600; cursor: pointer;
  transition: background-color var(--ease-ui), box-shadow var(--ease-ui); }
.btn--primary { background: var(--color-primary); color: var(--on-primary); }

/* Ancho fijo: los dos textos (y el icono y el anillo) comparten celda */
.btn__text, .btn__icon { display: grid; }
.btn__text > *, .btn__icon > * { grid-area: 1 / 1; }
.btn__text--centro { justify-items: center; }
.btn__busy { display: inline-flex; align-items: center; gap: 8px; }
.btn__busy, .btn__icon .i-anillo,
.btn[aria-busy="true"] .btn__idle, .btn[aria-busy="true"] .btn__icon > :not(.i-anillo) { visibility: hidden; }
.btn[aria-busy="true"] .btn__busy, .btn[aria-busy="true"] .i-anillo { visibility: visible; }
.btn[aria-busy="true"] { pointer-events: none; } /* sin hover ni clic */

.btn[aria-busy="true"] .i-descargar .i-mueve { animation: i-baja 1.2s ease-in-out infinite; }
.btn[aria-busy="true"] .i-subir .i-mueve { animation: i-sube 1.2s ease-in-out infinite; }
.btn[aria-busy="true"] .i-dibuja { stroke-dasharray: 1; animation: i-dibuja 1.2s ease-in-out infinite; }
.btn[aria-busy="true"] .i-tapa { transform-origin: 20px 7px; animation: i-tapa 1.2s ease-in-out infinite; }
.btn[aria-busy="true"] .i-gira { transform-origin: 12px 12px; animation: i-giro 1.2s linear infinite; }
.btn[aria-busy="true"] .i-onda { animation: i-onda 1.2s ease-in-out infinite; }
.btn[aria-busy="true"] .i-onda + .i-onda { animation-delay: 0.2s; }
.btn[aria-busy="true"] .i-vuela { animation: i-vuela 1.2s ease-in-out infinite; }
.btn[aria-busy="true"] .i-pulso { animation: i-pulso 1.2s ease-in-out infinite; }
.btn[aria-busy="true"] .i-pulso:nth-of-type(2) { animation-delay: 0.3s; }
.btn[aria-busy="true"] .i-pulso:nth-of-type(3) { animation-delay: 0.6s; }
.btn[aria-busy="true"] .i-anillo { animation: i-giro 0.8s linear infinite; }

@keyframes i-baja { 0% { transform: none; opacity: 1; } 60% { transform: translateY(5px); opacity: 0; }
  61% { transform: translateY(-5px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes i-sube { 0% { transform: none; opacity: 1; } 60% { transform: translateY(-5px); opacity: 0; }
  61% { transform: translateY(5px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes i-dibuja { 0% { stroke-dashoffset: 1; } 60%, 100% { stroke-dashoffset: 0; } }
@keyframes i-tapa { 0%, 100% { transform: none; } 50% { transform: translateY(-1.5px) rotate(12deg); } }
@keyframes i-giro { to { transform: rotate(360deg); } }
@keyframes i-onda { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
@keyframes i-vuela { 0% { transform: none; opacity: 1; } 50% { transform: translate(6px, -6px); opacity: 0; }
  51% { transform: translate(-6px, 6px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes i-pulso { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

@media (prefers-reduced-motion: reduce) {
  .btn[aria-busy="true"] .icon, .btn[aria-busy="true"] .icon * { animation: none !important; }
}

@container (min-width: 901px) { .l2 .fside .mid .box { padding-top: 44px !important; padding-bottom: 28px !important; } }
@container (min-width: 901px) { .l2 .bn .pan .mid, .l2 .pan .mid { display: flex !important; flex-direction: column; align-self: stretch; } .l2 .pan .mid .arte { margin-block: 0 !important; } .l2 .pan .mid .arte { position: relative; top: 11px; } .l2 .pan .mid .vals { margin-top: auto !important; margin-bottom: -5px; } .l2 .pan .mid .vals { display: grid !important; grid-template-columns: repeat(4, 1fr); gap: 0; } }
/* Todas las vistas de la tarjeta mantienen la misma altura; el pie queda abajo */
.l2 .box { display: flex; flex-direction: column; min-height: 670px; }
.l2 .box #host-1 { flex: 1; margin-bottom: 62px; }
.l2 .box .bfoot { margin-top: 0; }
/* Recuperar: el botón queda a la misma distancia del campo que "Ingresar"; el texto en proceso se centra */
.l2 .box #host-1:has(form[data-form="recuperar"]) { margin-bottom: 10px; }
#host-1:has(form[data-form="recuperar"]) .fwrap { display: flex; flex-direction: column; min-height: 413.7px; }
.l2 form[data-form="recuperar"] { flex: 1; display: flex; flex-direction: column; }
.l2 form[data-form="recuperar"] .btn--block { margin-top: auto; }
.l2 form[data-form="recuperar"] .link { align-self: center; margin-top: -8px; }
.btn__text > * { justify-self: center; }
.btn--block[aria-busy="true"] .btn__idle { display: none; }
/* Vistas finales: el botón queda a la misma altura que "Ingresar" */
.l2 .final { min-height: 361.7px; grid-template-rows: auto auto 1fr; }
.l2 .final .btn { align-self: end; }
/* Marca oficial vertical (cliente) en la tarjeta; claro y oscuro */
.blogo .vlogo { display: block; height: 105px; width: auto; }
.blogo .vlogo.vd { display: none; }
[data-mode="dark"] .blogo .vlogo.vl { display: none; }
[data-mode="dark"] .blogo .vlogo.vd { display: block; }
@container (max-width: 420px) { .blogo .vlogo { height: 96px; } }
</style>
<script>
// Iconos de la Regla 12. Los de módulo se agregan antes de usarlos: ICONOS.ventas = '<path d="…"/>'.
const ICONOS = {
  descargar: '<path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/><g class="i-mueve"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/></g>',
  subir: '<path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/><g class="i-mueve"><path d="M12 15V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/></g>',
  guardar: '<path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 3v4h7"/><path class="i-dibuja" pathLength="1" d="M7 21v-6a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v6"/>',
  eliminar: '<g class="i-tapa"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></g><path d="m6 7 1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M10 11v6m4-6v6"/>',
  aprobar: '<circle cx="12" cy="12" r="9"/><path class="i-dibuja" pathLength="1" d="m8.5 12.5 2.5 2.5 4.5-5"/>',
  rechazar: '<circle cx="12" cy="12" r="9"/><path class="i-gira" d="m9 9 6 6m0-6-6 6"/>',
  publicar: '<path d="M4 9.5h3l7-4v13l-7-4H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1z"/><path d="M7 14.5V19a1.5 1.5 0 0 0 3 0v-2.8"/><path class="i-onda" d="M17 9.5a3.5 3.5 0 0 1 0 5"/><path class="i-onda" d="M19.5 7a7 7 0 0 1 0 10"/>',
  enviar: '<g class="i-vuela"><path d="M21 3 3 10.5l7.5 3 3 7.5z"/><path d="m10.5 13.5 5-5"/></g>',
  ia: '<path class="i-pulso" d="M11 4.5 12.6 9l4.4 1.5-4.4 1.5-1.6 4.5L9.4 12 5 10.5 9.4 9z"/><path class="i-pulso" d="M18 3v4m-2-2h4"/><path class="i-pulso" d="M5.5 16.5v3M4 18h3"/>',
  anillo: '<circle cx="12" cy="12" r="9" opacity=".25"/><path d="M21 12a9 9 0 0 0-9-9"/>',
  contraer: '<path d="m14.5 7-5 5 5 5"/>',
  desplegar: '<path d="m7 10 5 5 5-5"/>',
  perfil: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  preferencias: '<path d="M4 6h9m4 0h3M4 12h3m4 0h9M4 18h11m4 0h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  salir: '<path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="m15 8 4 4-4 4M19 12H9"/>',
};
function icono(nombre, clase = '') {
  if (!(nombre in ICONOS)) console.warn('Falta el icono', nombre);
  return `<svg class="icon i-${nombre}${clase && ' ' + clase}" viewBox="0 0 24 24" aria-hidden="true">${ICONOS[nombre] || ''}</svg>`;
}
// Envuelve cualquier acción que tarda. Ignora clics y teclado mientras dura.
async function conProceso(boton, accion) {
  if (boton.getAttribute('aria-busy') === 'true') return;
  boton.setAttribute('aria-busy', 'true');
  boton.setAttribute('aria-disabled', 'true');
  try { return await accion(); }
  finally { boton.removeAttribute('aria-busy'); boton.removeAttribute('aria-disabled'); }
}

// Botón con proceso (Regla 11). Un icono del catálogo se anima; con un icono propio, el anillo toma
// su lugar; sin icono, el anillo va dentro del texto ocupado.
const ICONOS_ANIMADOS = ['descargar', 'subir', 'guardar', 'eliminar', 'aprobar', 'rechazar', 'publicar', 'enviar', 'ia'];
function btnProceso({ texto, gerundio, icono: ic, clase = '', tipo = 'button', attrs = '' }) {
  const textos = (anillo = '') =>
    `<span class="btn__idle">${texto}</span><span class="btn__busy">${anillo}${gerundio}</span>`;
  const cuerpo = !ic ? `<span class="btn__text btn__text--centro">${textos(icono('anillo'))}</span>`
    : ICONOS_ANIMADOS.includes(ic) ? `${icono(ic)}<span class="btn__text">${textos()}</span>`
    : `<span class="btn__icon">${icono(ic)}${icono('anillo')}</span><span class="btn__text">${textos()}</span>`;
  return `<button class="btn${clase && ' ' + clase}" type="${tipo}"${attrs && ' ' + attrs}>${cuerpo}</button>`;
}
</script>
<style>
:root {
  --color-primary: #007F89; --on-primary: #FFFFFF; --color-danger: #E24B4A; --danger-text: #B3302B;
  --bg: #F3F7F9; --surface: #FFFFFF; --surface-raised: #FFFFFF; --surface-sunken: #EAF0F3;
  --text-primary: #001E3C; --text-secondary: #4A5A6A; --divider: rgb(0 30 60 / 0.10);
  --navy: #001E3C; --navy-2: #0B3157; --navy-text: #F2F6F8; --navy-text-2: #A9BACB; --teal-soft: #2FC3CB;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root[data-theme="dark"] {
  --color-primary: #2FC3CB; --on-primary: #00101E; --danger-text: #F0665C; --bg: #00101E; --surface: #001629;
  --surface-raised: #12365A; --surface-sunken: #0A2540; --text-primary: #F2F6F8; --text-secondary: #A9BACB;
  --divider: rgb(255 255 255 / 0.10); --navy: #000F1E; --navy-2: #001E3C;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-primary: #2FC3CB; --on-primary: #00101E; --danger-text: #F0665C; --bg: #00101E; --surface: #001629;
    --surface-raised: #12365A; --surface-sunken: #0A2540; --text-primary: #F2F6F8; --text-secondary: #A9BACB;
    --divider: rgb(255 255 255 / 0.10); --navy: #000F1E; --navy-2: #001E3C;
  }
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--text-primary); font-family: var(--font); font-size: 15px; line-height: 1.5; }
h1, h2, h3, h4, p { margin: 0; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
button { font-family: inherit; }
img { display: block; max-width: 100%; }

.wrap { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-primary); }
.page-title { font-size: 28px; line-height: 1.2; font-weight: 600; margin: 8px 0; }
.page-sub { color: var(--text-secondary); max-width: 64ch; }
.controls { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; margin: 32px 0 16px; }
.ctl { display: grid; gap: 6px; }
.ctl > span { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 6px; background: var(--surface-sunken); flex-wrap: wrap; }
.seg button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 6px; background: none; color: var(--text-secondary); font-size: 14px; cursor: pointer; transition: background-color var(--ease-ui); }
.seg button[aria-pressed="true"] { background: var(--surface-raised); color: var(--text-primary); font-weight: 600; box-shadow: var(--shadow); }
.theme-btn { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; border-radius: 6px; background: var(--surface); color: var(--text-primary); box-shadow: var(--shadow); cursor: pointer; font-size: 14px; }
@media (hover: hover) and (pointer: fine) { .theme-btn:hover { box-shadow: var(--shadow-hover); } }
.desc { display: flex; gap: 10px; align-items: flex-start; color: var(--text-secondary); max-width: 80ch; margin-bottom: 16px; }
.desc .icon { width: 18px; height: 18px; margin-top: 3px; color: var(--color-primary); }

.frame { container-type: inline-size; width: 100%; margin-inline: auto; border-radius: 6px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow-hover); transition: max-width 300ms ease-out; }
.frame[hidden] { display: none; }
.frame.movil { max-width: 390px; }

/* Logo: sobre navy siempre la versión para fondo oscuro; sobre superficie se cambia con el tema */
.lg-nav { height: 46px; width: auto; align-self: flex-start; justify-self: start; flex: none; }
.swap img { height: 42px; width: auto; justify-self: start; }
.swap .lg-d { display: none; }
:root[data-theme="dark"] .swap .lg-l { display: none; }
:root[data-theme="dark"] .swap .lg-d { display: block; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .swap .lg-l { display: none; }
  :root:not([data-theme="light"]) .swap .lg-d { display: block; }
}

/* Formulario compartido */
.fcell { display: grid; place-items: center; padding: 48px 32px; }
.fwrap { width: 100%; max-width: 380px; display: grid; gap: 20px; }
.fhead { display: grid; gap: 6px; }
.fhead h2 { font-size: 24px; line-height: 1.2; font-weight: 600; }
.fhead p { color: var(--text-secondary); }
.form { display: grid; gap: 16px; }
.form fieldset { display: grid; gap: 16px; border: 0; margin: 0; padding: 0; min-width: 0; }
.field { display: grid; gap: 6px; }
.field > label { font-size: 13px; font-weight: 600; }
.input { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 4px 0 12px; border-radius: 6px; background: var(--surface-sunken); color: var(--text-secondary); }
.input input { flex: 1; min-width: 0; height: 44px; border: 0; background: none; font: inherit; color: var(--text-primary); outline: none; padding-right: 8px; }
.input input::placeholder { color: var(--text-secondary); opacity: 0.8; }
.input:focus-within { outline: 2px solid var(--color-primary); outline-offset: 2px; }
.input.err { background: color-mix(in srgb, var(--color-danger) 10%, var(--surface)); }
.input .ibtn { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 6px; background: none; color: var(--text-secondary); cursor: pointer; }
.input .ibtn:focus-visible { outline-offset: 0; }
@media (hover: hover) and (pointer: fine) { .input .ibtn:hover { color: var(--text-primary); } }
.ferr { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; color: var(--danger-text); }
.ferr .icon { margin-top: 2px; width: 14px; height: 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; min-height: 44px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--color-primary); margin: 0; }
.link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: 0; background: none; color: var(--color-primary); font-size: 14px; font-weight: 600; cursor: pointer; }
.link--sm { min-height: 32px; }
@media (hover: hover) and (pointer: fine) { .link:hover { text-decoration: underline; } }
.btn--block { width: 100%; }
.btn--primary:disabled { opacity: 0.5; cursor: not-allowed; }
@media (hover: hover) and (pointer: fine) {
  .btn--primary:not([aria-busy="true"]):not(:disabled):hover { background: color-mix(in srgb, var(--color-primary) 86%, #000); }
  .btn--soft:hover { box-shadow: var(--shadow-hover); }
}
.btn--soft { background: var(--surface-sunken); color: var(--text-primary); box-shadow: var(--shadow); }
.sep { display: flex; align-items: center; gap: 12px; color: var(--text-secondary); font-size: 13px; }
.sep::before, .sep::after { content: ""; height: 1px; flex: 1; background: var(--divider); }
.alt { display: grid; gap: 4px; justify-items: start; padding-top: 4px; }
.alt p { font-size: 14px; color: var(--text-secondary); }
.aviso { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 6px; font-size: 14px; }
.aviso .icon { margin-top: 2px; width: 18px; height: 18px; }
.aviso--error { background: color-mix(in srgb, var(--color-danger) 10%, var(--surface)); }
.aviso--error .icon { color: var(--danger-text); }
.aviso--info { background: color-mix(in srgb, var(--color-primary) 10%, var(--surface)); }
.aviso--info .icon { color: var(--color-primary); }
.aviso .link { min-height: 28px; margin-top: 4px; }
.aviso > div { display: grid; }
.final { display: grid; gap: 16px; justify-items: start; }
.final .okbox { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 6px; color: #1D9E75; background: color-mix(in srgb, #1D9E75 12%, var(--surface)); }
.final .okbox .icon { width: 24px; height: 24px; }

.bn .arte .card { fill: var(--surface-raised); stroke: var(--vx-ring); stroke-opacity: 0.4; stroke-width: 1; }
.bn .arte .card.hot { stroke: var(--vx-p2); stroke-opacity: 1; stroke-width: 1.6; }
.bn .arte .col { fill: var(--vx-ring); fill-opacity: 0.06; stroke: none; }
.bn .arte .slot { fill: none; stroke: var(--vx-p2); stroke-opacity: 0.7; stroke-width: 1.2; stroke-dasharray: 4 4; }
.bn .arte .tl { fill: var(--text-secondary); fill-opacity: 0.4; }
.bn .arte .ic { color: var(--vx-p1); }
.bn .arte .avc { fill: var(--vx-p1); fill-opacity: 0.16; }
.bn .arte .rq { fill: none; stroke: var(--vx-ring); stroke-opacity: 0.5; stroke-width: 1.2; }
.bn .arte .ck { fill: var(--vx-p1); fill-opacity: 0.1; stroke: var(--vx-p1); stroke-width: 1.2; animation: ckon var(--dur) ease-in-out infinite; }
.bn .arte .cm { fill: none; stroke: var(--surface-raised); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: 0; animation: cmon var(--dur) ease-in-out infinite; }
@keyframes ckon { 0%, 6% { fill-opacity: 0.1; } 16%, 84% { fill-opacity: 1; } 96%, 100% { fill-opacity: 0.1; } }
@keyframes cmon { 0%, 6% { opacity: 0; } 16%, 84% { opacity: 1; } 96%, 100% { opacity: 0; } }
.bn .arte .fin { color: var(--vx-p2); transform-box: fill-box; transform-origin: center; animation: fin var(--dur) ease-in-out infinite; }
.bn .arte .fin circle { fill: var(--surface-raised); stroke: var(--vx-p2); stroke-width: 1.6; }
@keyframes fin { 0%, 58% { opacity: 0; transform: scale(0.6); } 70%, 92% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.6); } }
.bn .arte .kan { animation: kan var(--dur) ease-in-out infinite; }
@keyframes kan { 0%, 10% { transform: translateX(0); } 28%, 38% { transform: translateX(108px); } 54%, 64% { transform: translateX(216px); } 80%, 94% { transform: translateX(324px); } 100% { transform: translateX(324px); opacity: 0; } }
.bn .arte .slot2 { fill: none; stroke: var(--vx-p2); stroke-width: 1.4; stroke-dasharray: 4 4; animation: dmove 3s linear infinite; }
.bn .arte .slotf { fill: var(--vx-p2); fill-opacity: 0; animation: slotf var(--dur) ease-in-out infinite; }
@keyframes slotf { 0%, 50% { fill-opacity: 0; } 62%, 88% { fill-opacity: 0.85; } 100% { fill-opacity: 0; } }
.bn .arte .cand { color: var(--vx-p1); animation: cand var(--dur) ease-in-out infinite; }
.bn .arte .cand .cc { fill: var(--surface-raised); stroke: var(--vx-p1); stroke-width: 1.6; }
@keyframes cand { 0% { opacity: 0; transform: translateY(0); } 8% { opacity: 1; } 50%, 82% { opacity: 1; transform: translateY(-160px); } 94%, 100% { opacity: 0; transform: translateY(-160px); } }
.bn .arte .gl { stroke: var(--vx-ring); stroke-opacity: 0.2; stroke-width: 1; }
.bn .arte .blk { fill: var(--vx-p1); fill-opacity: 0.14; stroke: var(--vx-p1); stroke-opacity: 0.6; stroke-width: 1; }
.bn .arte .pop.o .blk { fill: var(--vx-p2); stroke: var(--vx-p2); } .bn .arte .pop.o .ic { color: var(--vx-p2); }
.bn .arte .pop { transform-box: fill-box; transform-origin: center; animation: pop var(--dur) ease-out infinite; }
@keyframes pop { 0%, 4% { opacity: 0; transform: scale(0.85); } 14%, 88% { opacity: 1; transform: scale(1); } 98%, 100% { opacity: 0; transform: scale(0.85); } }

@keyframes fb { 0%, 4% { transform: scaleX(0); } 40%, 88% { transform: scaleX(var(--w)); } 98%, 100% { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .bn .arte .ck, .bn .arte .cm, .bn .arte .fin, .bn .arte .kan, .bn .arte .slot2, .bn .arte .slotf, .bn .arte .cand, .bn .arte .pop, .bn .arte .fb { animation: none; }
  .bn .arte .ck { fill-opacity: 1; } .bn .arte .cm { opacity: 1; } .bn .arte .fin { opacity: 1; } .bn .arte .cand { opacity: 0; } .bn .arte .fb { transform: scaleX(var(--w)); } }

/* Pagina completa */
html, body { min-height: 100%; }
.page.frame { max-width: none; border-radius: 0; box-shadow: none; min-height: 100dvh; background: var(--surface); }
.page .sp { min-height: 100dvh; }
.tfix { position: fixed; top: 16px; right: 16px; z-index: 20; margin: 0; }
.bn .plogo { display: none; }
.bn .pan { padding: 48px clamp(32px, 5vw, 72px); }
.bn .pan .mid { width: 100%; max-width: 520px; margin-inline: auto; }
.bn .arte { max-width: 520px; max-height: 360px; }
.fside { padding: 24px clamp(24px, 5vw, 72px); }

/* Al achicarse, el panel pasa arriba del login y se reduce de forma continua */
@container (max-width: 900px) {
  .page .sp { grid-template-columns: 1fr; min-height: 0; }
  .bn .pan { order: -1; grid-template-rows: auto auto; gap: 16px; padding: 24px clamp(16px, 4vw, 40px) clamp(8px, 2vw, 16px); background: linear-gradient(to bottom, var(--vx-bg) 55%, var(--surface)); }
  .bn .plogo { display: block; }
  .bn .pan .mid { gap: 12px; max-width: 640px; }
  .bn .pan h2 { font-size: clamp(22px, 5.4vw, 34px); max-width: 22ch; }
  .bn .arte { width: 100%; height: clamp(120px, 36vw, 280px); max-height: none; max-width: none; margin-block: 0; }
  .bn .vals { gap: clamp(12px, 3vw, 24px); margin-top: 0; }
  .fside { padding: 28px 16px 32px; }
  .fside .top { display: none; }
  .fside .mid { padding: 0; }
}
@container (max-width: 560px) {
  .bn .pan .lead { display: none; }
  .bn .vals { grid-template-columns: repeat(4, 1fr); justify-content: stretch; }
  .bn .vals li { font-size: 12px; }
}
@container (max-width: 420px) { .bn .vals { display: none; } .fside { padding-top: 8px; } }

/* Login 2: el formulario es una tarjeta sobre el fondo del panel, en pantalla grande y en movil */
.l2.frame { background: var(--vx-bg); }
.l2 .fside { background: transparent; }
.l2 .fside .top { width: 100%; max-width: 460px; margin-inline: auto; }
.l2 .fside .mid > div { max-width: 460px; }
.l2 .box { background: var(--surface); border-radius: 6px; box-shadow: var(--shadow-hover); padding: clamp(28px, 3vw, 44px); padding-top: clamp(44px, 4vw, 56px); padding-bottom: clamp(36px, 4vw, 56px); }
.l2 .bot { padding-top: 4px; }
@container (max-width: 900px) {
  .l2 .pan { background: var(--vx-bg); padding-bottom: 56px; }
  .l2 .fside { position: relative; margin-top: -32px; padding: 0 12px 24px; }
  .l2 .fside .mid { padding: 0; }
  .l2 .box { padding: 40px 36px 32px; }
}
@container (max-width: 420px) { .l2 .fside { padding: 0 12px 24px; } .l2 .box { padding: 36px 32px 28px; } }

/* Marca apilada, con las proporciones de la referencia: isotipo centrado arriba, nombre abajo,
   y a la derecha el separador y el nombre alineados con la franja del nombre de marca */
.brand { --k: 1; display: inline-flex; align-items: flex-end; gap: calc(var(--k) * 10px); }
.brand .bmark { display: grid; justify-items: center; gap: calc(var(--k) * 6px); }
.brand .iso { width: auto; height: calc(var(--k) * 72px); }
.brand .word { width: calc(var(--k) * 154px); height: auto; }
.brand .bsep { align-self: flex-end; width: 1px; height: calc(var(--k) * 28px); background: color-mix(in srgb, var(--text-secondary) 40%, transparent); }
.brand .bname { display: grid; align-self: flex-end; font-size: calc(var(--k) * 15px); line-height: 1.12; font-weight: 600; padding-left: calc(var(--k) * 6px); color: color-mix(in srgb, var(--text-secondary) 72%, transparent); }
.plogo .brand { --k: 0.7; }
@container (max-width: 420px) { .plogo .brand { --k: 0.62; } }

/* Logo dentro de la tarjeta, centrado, y encabezado del formulario */
.blogo { display: grid; justify-items: center; margin-bottom: 28px; }
.blogo .brand { --k: 0.95; }
@container (max-width: 420px) { .blogo .brand { --k: 0.85; } }
.fhead { gap: 8px; }
.fhead h2 { font-size: 28px; line-height: 1.15; font-weight: 700; }

/* Pie de la tarjeta; solo el logo sube, el resto no se mueve */
.bfoot { margin-top: 62px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--text-secondary) 20%, transparent); text-align: center; font-size: 12px; color: color-mix(in srgb, var(--text-secondary) 75%, transparent); }
.blogo { margin-bottom: 40px; position: relative; top: -1px; }

/* Pantalla grande: la tarjeta se alinea con el contenido del panel (mismo margen superior y centrado vertical) */
@container (min-width: 901px) {
  .l2 .fside .top { display: none; }
  .l2 .fside { padding-block: 48px; }
  .l2 .fside .mid { padding: 0; }
}

/* Los valores y el panel respetan el ancho de la tarjeta del login */
.bn .vals { display: flex; justify-content: space-between; gap: 8px; width: 100%; }
@container (max-width: 900px) {
  .bn .pan { padding-inline: 12px; }
  .bn .pan .mid { width: 100%; max-width: 460px; }
}
/* Pantalla grande: panel y tarjeta arrancan a la misma altura; el conjunto se centra en vertical */
@container (min-width: 901px) { .l2 .sp { align-content: center; } .l2 .fside .mid { align-items: start; } .l2 .bn .pan .mid, .l2 .pan .mid { align-content: start; } }

/* EPS Sanitas: azules del logo. Claro: azul #0079C1 + celeste; oscuro: marino con celeste */
:root { --color-primary: #0079C1; --on-primary: #FFFFFF; --bg: #EAF4FA; --surface: #FFFFFF; --surface-raised: #FFFFFF; --surface-sunken: #EBF3F9;
  --text-primary: #0B2A44; --text-secondary: #4A6074; --divider: rgb(11 42 68 / 0.10); }
:root[data-theme="dark"] { --color-primary: #3FB8EC; --on-primary: #00172B; --bg: #00172B; --surface: #002038; --surface-raised: #0B3150;
  --surface-sunken: #0B2F4D; --text-primary: #F2F7FB; --text-secondary: #A7BCCD; --divider: rgb(255 255 255 / 0.10); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --color-primary: #3FB8EC; --on-primary: #00172B; --bg: #00172B; --surface: #002038;
  --surface-raised: #0B3150; --surface-sunken: #0B2F4D; --text-primary: #F2F7FB; --text-secondary: #A7BCCD; --divider: rgb(255 255 255 / 0.10); } }
[data-pal="marino"][data-mode="light"] { --vx-bg: #E3F1FA; --vx-ring: #0079C1; --surface: #FFFFFF; --surface-raised: #FFFFFF; --surface-sunken: #EBF3F9;
  --text-primary: #0B2A44; --text-secondary: #4A6074; --divider: rgb(11 42 68 / 0.10); --color-primary: #0079C1; --on-primary: #FFFFFF; --danger-text: #B3302B;
  --shadow-rgb: 0 40 80; --vx-p1: #0079C1; --vx-p2: #1A97D4; }
[data-pal="marino"][data-mode="dark"] { --vx-bg: #00172B; --vx-ring: #3FB8EC; --surface: #002038; --surface-raised: #002038; --surface-sunken: #0B2F4D;
  --text-primary: #F2F7FB; --text-secondary: #A7BCCD; --divider: rgb(255 255 255 / 0.10); --color-primary: #3FB8EC; --on-primary: #00172B; --danger-text: #F0665C;
  --shadow-rgb: 0 0 0; --vx-p1: #3FB8EC; --vx-p2: #8FD8F7; }
.blogo .vlogo { height: auto; width: min(280px, 100%); }
@container (max-width: 420px) { .blogo .vlogo { height: auto; width: min(240px, 100%); } }
</style>

function aviso(s) {
  const cand = s.modo === 'candidato';
  if (s.estado === 'error') {
    return cand
      ? `<div class="aviso aviso--error" role="alert">${icono('alerta')}<div>No encontramos una postulación con ese correo y documento. Revise que sean los de su postulación.</div></div>`
      : `<div class="aviso aviso--error" role="alert">${icono('alerta')}<div>Correo o contraseña incorrectos. Le quedan ${s.intentos} ${s.intentos === 1 ? 'intento' : 'intentos'}.</div></div>`;
  }
  if (s.estado === 'bloqueada' && !cand) {
    return `<div class="aviso aviso--error" role="alert">${icono('candado')}<div>Bloqueamos su cuenta por 15 minutos tras varios intentos fallidos.<button class="link link--sm" type="button" data-act="recuperar">Restablecer mi contraseña</button></div></div>`;
  }
  if (s.estado === 'expirada') {
    return `<div class="aviso aviso--info" role="status">${icono('info')}<div>Su sesión expiró por inactividad. Vuelva a ingresar para continuar.</div></div>`;
  }
  return '';
}
function encabezado(s) {
  if (s.vista === 'recuperar') return ['Restablezca su contraseña', 'Le enviaremos un enlace al correo de su cuenta.'];
  if (s.paso && s.modo === 'equipo' && s.step === 2 && s.vista === 'form') return ['Ingrese su contraseña', 'Falta un último paso.'];
  if (s.modo === 'candidato') return ['Consulte sus postulaciones', 'Ingrese con el correo y el documento que usó al postularse.'];
  return ['Inicie sesión', 'Ingrese sus datos para acceder al auditor de evolución de pacientes.'];
}
function render(host) {
  const s = host._s, v = s.v, e = s.errs;
  const [t, sub] = encabezado(s);
  const bloqueada = s.estado === 'bloqueada' && s.modo === 'equipo';
  let body = '';
  if (s.puertas && !s.modo) {
    const card = (m, ic, t, d) => `<button class="door" type="button" data-act="modo" data-v="${m}"><span class="dbox">${icono(ic)}</span><strong>${t}</strong><small>${d}</small><span class="go">${icono('flecha')}</span></button>`;
    host.innerHTML = `<div class="fwrap"><div class="fhead"><h2>¿Cómo desea entrar?</h2><p>Elija su tipo de acceso para continuar.</p></div><div class="doors">`
      + card('equipo', 'usuarios', 'Equipo EPS Sanitas', 'Enfermería, médicos y administración.')
      + card('candidato', 'documento', 'Soy candidato', 'Consulte el estado de sus postulaciones.') + '</div></div>';
    return;
  }
  if (s.vista === 'exito') {
    body = `<div class="final"><span class="okbox">${icono('aprobar')}</span>
      <div class="fhead"><h2>Ingreso correcto</h2><p>Lo llevamos a ${s.modo === 'candidato' ? 'sus postulaciones' : 'su tablero'}.</p></div>
      <button class="btn btn--soft btn--block" type="button" data-act="reiniciar">${icono('volver')}Volver a probar</button></div>`;
  } else if (s.vista === 'enviado') {
    body = `<div class="final"><span class="okbox">${icono('correo')}</span>
      <div class="fhead"><h2>Revise su correo</h2><p>Si ${esc(v.correo)} tiene una cuenta, le enviamos un enlace válido por 30 minutos.</p></div>
      <button class="btn btn--soft btn--block" type="button" data-act="volver">${icono('volver')}Volver a ingresar</button></div>`;
  } else if (s.vista === 'recuperar') {
    body = `<div class="fhead"><h2>${t}</h2><p>${sub}</p></div>
      <form class="form" novalidate data-form="recuperar">
        ${campo({ id: 'correo', label: 'Correo institucional', icon: 'correo', type: 'email', value: v.correo, ph: 'nombre@demo.local', err: e.correo, ac: 'email' })}
        ${btnProceso({ texto: 'Enviar enlace de recuperación', gerundio: 'Enviando', icono: 'enviar', clase: 'btn--primary btn--block', tipo: 'submit' })}
        <button class="link" type="button" data-act="volver">${icono('volver')}Volver a ingresar</button>
      </form>`;
  } else if (s.paso && s.modo === 'equipo' && s.step === 1) {
    body = `<div class="fhead"><h2>Ingrese al auditor</h2><p>Escriba su correo institucional para empezar.</p></div>${aviso(s)}
      <form class="form" novalidate data-form="paso1">
        ${campo({ id: 'correo', label: 'Correo institucional', icon: 'correo', type: 'email', value: v.correo, ph: 'nombre@demo.local', err: e.correo, ac: 'username' })}
        ${btnProceso({ texto: 'Continuar', gerundio: 'Verificando', icono: 'flecha', clase: 'btn--primary btn--block', tipo: 'submit' })}
      </form>`;
  } else {
    body = `<div class="fhead"><h2>${t}</h2><p>${sub}</p></div>${aviso(s)}
      <form class="form" novalidate data-form="equipo">
        <fieldset${bloqueada ? ' disabled' : ''}>
          ${s.paso ? cuenta(s) : campo({ id: 'correo', label: 'Correo institucional', icon: 'correo', type: 'email', value: v.correo, ph: 'nombre@demo.local', err: e.correo, ac: 'username' })}
          ${campo({ id: 'clave', label: 'Contraseña', icon: 'candado', type: 'password', value: v.clave, ph: 'Su contraseña', err: e.clave, ac: 'current-password', ver: s.ver, verBtn: true })}
          <div class="row"><label class="check"><input type="checkbox" name="rememberMe"${v.mantener ? ' checked' : ''}>Recuérdame</label>
          <button class="link" type="button" data-act="recuperar">¿Olvidó su contraseña?</button></div>
        </fieldset>
        ${btnProceso({ texto: 'Ingresar', gerundio: 'Ingresando', icono: 'ingresar', clase: 'btn--primary btn--block', tipo: 'submit', attrs: bloqueada ? 'disabled' : '' })}
      </form>`;
  }
  const paso2 = s.paso && s.modo === 'equipo' && s.vista === 'form';
  host.innerHTML = `<div class="fwrap${paso2 && s.step === 2 ? ' step2' : ''}">${paso2 ? progreso(s) : ''}${body}</div>`;
  if (s.focus) { host.querySelector(s.focus)?.focus(); s.focus = null; }
}
const nuevoEstado = (f = {}) => ({ flags: f, ...f, step: 1, modo: f.puertas ? '' : 'equipo', vista: 'form', estado: 'normal', intentos: MAX_INTENTOS, ver: false,
  v: { correo: '', clave: '', documento: '', mantener: true }, errs: {}, focus: null });
function leer(host, form) {
  const s = host._s, d = new FormData(form);
  for (const k of ['correo', 'clave', 'documento']) if (d.has(k)) s.v[k] = d.get(k).trim();
  if (form.dataset.form === 'equipo') s.v.mantener = d.has('rememberMe');
}
function validar(s, tipo) {
  const e = {}, v = s.v;
  if (!v.correo) e.correo = 'Escriba su correo.';
  else if (!/^\S+@\S+\.\S+$/.test(v.correo)) e.correo = 'Escriba un correo válido, por ejemplo nombre@demo.local.';
  if (tipo === 'equipo' && !v.clave) e.clave = 'Escriba su contraseña.';
  return e;
}
function toast(msg) {
  const t = $('#toast');
  t.innerHTML = `${icono('aprobar')}<span>${esc(msg)}</span>`; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600);
}
function enlazar(host) {
  host.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-act]'); if (!b || !host.contains(b)) return;
    const s = host._s, f = host.querySelector('form'); if (f) leer(host, f);
    const act = b.dataset.act;
    if (act === 'ver') { s.ver = !s.ver; s.focus = '#clave'; }
    else if (act === 'puertas') { s.modo = ''; s.errs = {}; s.estado = 'normal'; s.vista = 'form'; }
    else if (act === 'atras') { s.step = 1; s.errs = {}; s.estado = 'normal'; s.focus = '#correo'; }
    else if (act === 'modo') { s.modo = b.dataset.v; s.errs = {}; s.estado = 'normal'; s.vista = 'form'; s.focus = '#correo'; }
    else if (act === 'recuperar') { s.vista = 'recuperar'; s.errs = {}; s.estado = 'normal'; s.focus = '#correo'; }
    else if (act === 'volver') { s.vista = 'form'; s.errs = {}; s.focus = '#correo'; }
    else if (act === 'reiniciar') { host._s = nuevoEstado(host._s.flags); }
    render(host);
  });
  host.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const form = ev.target, s = host._s, tipo = form.dataset.form;
    leer(host, form);
    s.errs = validar(s, tipo === 'recuperar' || tipo === 'paso1' ? 'rec' : tipo);
    if (Object.keys(s.errs).length) {
      s.estado = 'normal';
      s.focus = s.errs.correo ? '#correo' : (s.errs.clave ? '#clave' : '#documento');
      return render(host);
    }
    await conProceso(form.querySelector('.btn--primary'), async () => {
      await sleep(1100);
      if (tipo === 'paso1') { s.step = 2; s.focus = '#clave'; return; }
      if (tipo === 'recuperar') { s.vista = 'enviado'; return; }
      if (s.v.clave === 'demo1234') { s.vista = 'exito'; s.estado = 'normal'; toast('Ingreso correcto.'); return; }
      s.intentos -= 1;
      s.estado = s.intentos <= 0 ? 'bloqueada' : 'error';
      s.v.clave = ''; s.focus = '#clave';
    });
    render(host);
  });
}
const FLAGS = {};
const hosts = [1].map((n) => { const h = $('#host-' + n); h._s = nuevoEstado(FLAGS[n]); enlazar(h); render(h); return h; });

function alt() { return ''; }
function cuenta(s) {
  const ini = esc((s.v.correo[0] || '?').toUpperCase());
  return `<input type="hidden" name="correo" value="${esc(s.v.correo)}"><div class="cuenta"><span class="av">${ini}</span><span class="em">${esc(s.v.correo)}</span><button class="link" type="button" data-act="atras">Cambiar</button></div>`;
}
function progreso(s) {
  return `<div><div class="prog"><span style="width:${s.step === 2 ? 100 : 50}%"></span></div><p class="stepl">Paso ${s.step} de 2</p></div>`;
}


const PALN = { marino: 'Marino', turquesa: 'Turquesa', calido: 'Cálido', grafito: 'Grafito', degrade: 'Degradé' };
let modo = (() => { try { const m = localStorage.getItem('ppa-tema'); if (m === 'light' || m === 'dark') return m; } catch (e) { /* sin almacenamiento */ } return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; })();
function aplicar() {
  $('#frame-1').dataset.mode = modo;
  document.documentElement.dataset.theme = modo;
  document.querySelectorAll('[data-tema]').forEach((b) => { b.innerHTML = icono(modo === 'dark' ? 'sol' : 'luna'); });
  try { localStorage.setItem('ppa-tema', modo); } catch (e) { /* sin almacenamiento */ }
}
document.addEventListener('click', (ev) => { if (ev.target.closest('[data-tema]')) { modo = modo === 'dark' ? 'light' : 'dark'; aplicar(); } });

Object.assign(ICONOS, {
  corazon: '<path d="M12 21C7 17 3 13.500 3 9.500A4.500 4.500 0 0 1 12 7a4.500 4.500 0 0 1 9 2.500C21 13.500 17 17 12 21z"/>',

  bombilla: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.500 10.900c.6.500 1 1.200 1 2.100h5c0-.9.4-1.600 1-2.100A6 6 0 0 0 12 3z"/>',
  equipo: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.500"/><path d="M3 20a6 6 0 0 1 12 0M15 14.500a5 5 0 0 1 6 5"/>',
  trofeo: '<path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 13v4M8 20h8M10 17h4"/>',
  objetivo: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.500"/>',
  organigrama: '<rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/>',
  grafico: '<path d="M5 20v-7M12 20V5M19 20v-10"/>',
});

const SVGI = (x, y, w, ic) => `<svg class="icon" x="${x - w / 2}" y="${y - w / 2}" width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONOS[ic]}</svg>`;
const ONDAS = (cx, cy, r, cls = '', k = 5) => `<g class="deco ${cls}" stroke="currentColor">` + `<circle cx="${cx}" cy="${cy}" r="${r}"/>`.repeat(k) + '</g>';
const ISO = (cx, cy, s) => `<image href="${LOGO.iso}" x="${cx - s / 2}" y="${cy - s / 2}" width="${s}" height="${s}"/>`;
const R = (x, y, w, h, c = '', rx = 6, st = '') => `<rect class="${c}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"${st && ` style="${st}"`}/>`;
const TL = (x, y, w) => R(x, y, w, 6, 'tl', 3);
const TX = (x, y, s, st = '') => `<text x="${x}" y="${y}"${st && ` style="${st}"`}>${s}</text>`;
const dl = (k) => `animation-delay:calc(var(--dur) * ${k})`;
Object.assign(ICONOS, {
  registro: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/>',

});
