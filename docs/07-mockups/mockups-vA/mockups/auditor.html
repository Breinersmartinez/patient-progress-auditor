<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Progress Auditor, mockup</title>
<style>
:root {
  --radius-ui: 6px;
  --lift-interactive: -1.5px;
  --lift-static: -0.75px;
  --ease-ui: 400ms ease-out;
  --press-in: 100ms;
  --shadow-rgb: 0 0 0; /* negro sobre fondos neutros */

  --color-primary: #3D5AFE;
  --on-primary: #FFFFFF;
  --color-success: #1D9E75;
  --color-danger: #E24B4A;
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --surface-raised: #FFFFFF;
  --surface-sunken: #F1F1EE;
  --text-primary: #1F1F1E;
  --text-secondary: #5F5E5A;
  --divider: rgb(0 0 0 / 0.07);
  --color-selected: color-mix(in srgb, var(--color-primary) 8%, var(--surface));
}

/* Las sombras se declaran en * y no solo en :root, para que tomen el
   --shadow-rgb del fondo donde están (probado: en :root no tiñe). */
* {
  --shadow: 0 1px 4px rgb(var(--shadow-rgb) / 0.08);
  --shadow-hover: 0 3px 10px rgb(var(--shadow-rgb) / 0.12);
  --shadow-up: 0 -1px 4px rgb(var(--shadow-rgb) / 0.08);
}

.section--lavender { background: #EEEBFA; --shadow-rgb: 34 23 79; }
.section--mint     { background: #E8F4EE; --shadow-rgb: 23 79 51; }

@media (prefers-reduced-motion: reduce) {
  :root { --lift-interactive: 0px; --lift-static: 0px; }
}

.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--radius-ui);
  font: inherit; font-weight: 600; cursor: pointer;
  transition: background-color var(--ease-ui), box-shadow var(--ease-ui); }
.btn--primary { background: var(--color-primary); color: var(--on-primary); }

/* Ancho fijo: los dos textos (y el icono y el anillo) comparten celda */
.btn__text, .btn__icon { display: grid; }
.btn__text > *, .btn__icon > * { grid-area: 1 / 1; }
.btn__text--centro { justify-items: center; }
.btn__busy { display: inline-flex; align-items: center; gap: 8px; }
.btn__busy, .btn__icon .i-anillo,
.btn[aria-busy="true"] .btn__idle, .btn[aria-busy="true"] .btn__icon > :not(.i-anillo) { visibility: hidden; }
.btn[aria-busy="true"] .btn__busy, .btn[aria-busy="true"] .i-anillo { visibility: visible; }
.btn[aria-busy="true"] { pointer-events: none; } /* sin hover ni clic */

.btn[aria-busy="true"] .i-descargar .i-mueve { animation: i-baja 1.2s ease-in-out infinite; }
.btn[aria-busy="true"] .i-subir .i-mueve { animation: i-sube 1.2s ease-in-out infinite; }
.btn[aria-busy="true"] .i-dibuja { stroke-dasharray: 1; animation: i-dibuja 1.2s ease-in-out infinite; }
.btn[aria-busy="true"] .i-tapa { transform-origin: 20px 7px; animation: i-tapa 1.2s ease-in-out infinite; }
.btn[aria-busy="true"] .i-gira { transform-origin: 12px 12px; animation: i-giro 1.2s linear infinite; }
.btn[aria-busy="true"] .i-onda { animation: i-onda 1.2s ease-in-out infinite; }
.btn[aria-busy="true"] .i-onda + .i-onda { animation-delay: 0.2s; }
.btn[aria-busy="true"] .i-vuela { animation: i-vuela 1.2s ease-in-out infinite; }
.btn[aria-busy="true"] .i-pulso { animation: i-pulso 1.2s ease-in-out infinite; }
.btn[aria-busy="true"] .i-pulso:nth-of-type(2) { animation-delay: 0.3s; }
.btn[aria-busy="true"] .i-pulso:nth-of-type(3) { animation-delay: 0.6s; }
.btn[aria-busy="true"] .i-anillo { animation: i-giro 0.8s linear infinite; }

@keyframes i-baja { 0% { transform: none; opacity: 1; } 60% { transform: translateY(5px); opacity: 0; }
  61% { transform: translateY(-5px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes i-sube { 0% { transform: none; opacity: 1; } 60% { transform: translateY(-5px); opacity: 0; }
  61% { transform: translateY(5px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes i-dibuja { 0% { stroke-dashoffset: 1; } 60%, 100% { stroke-dashoffset: 0; } }
@keyframes i-tapa { 0%, 100% { transform: none; } 50% { transform: translateY(-1.5px) rotate(12deg); } }
@keyframes i-giro { to { transform: rotate(360deg); } }
@keyframes i-onda { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
@keyframes i-vuela { 0% { transform: none; opacity: 1; } 50% { transform: translate(6px, -6px); opacity: 0; }
  51% { transform: translate(-6px, 6px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes i-pulso { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

@media (prefers-reduced-motion: reduce) {
  .btn[aria-busy="true"] .icon, .btn[aria-busy="true"] .icon * { animation: none !important; }
}
.sb {
  --sb-tint: color-mix(in srgb, var(--color-primary) 8%, var(--surface));
  --sb-box: #FFFFFF;               /* en modo oscuro, var(--surface-raised) */
  --sb-line: rgb(0 0 0 / 0.12);    /* borde de la caja y guía de submódulos */
  --sb-dur: 300ms; --sb-hover: 400ms; --sb-shift: 2px;
  position: sticky; top: 0; z-index: 10; flex: none;
  display: flex; flex-direction: column; gap: 8px;
  width: 244px; height: 100dvh; padding: 20px 12px 12px;
  background: var(--surface); box-shadow: var(--shadow);
  transition: width var(--sb-dur) ease-out;
}
.sb, .sb *, .sb *::before, .sb *::after { box-sizing: border-box; }
.sb[data-collapsed="true"] { width: 76px; }
@media (prefers-reduced-motion: reduce) { .sb { --sb-dur: 0ms; --sb-hover: 0ms; --sb-shift: 0px; } }

.sb-toggle { position: absolute; top: 33px; right: -14px; z-index: 1; width: 28px; height: 28px;
  display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%;
  background: var(--surface); box-shadow: var(--shadow); color: var(--text-secondary); cursor: pointer; }
.sb-toggle .icon { transition: rotate var(--sb-dur) ease-out; }
.sb[data-collapsed="true"] .sb-toggle .icon { rotate: 180deg; }

.sb-list, .sb-sub { list-style: none; margin: 0; padding: 0; }
.sb-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; } /* sin esto el texto ensancha la fila al contraer */
.sb-item, .sb-user { position: relative; }

.sb-mod { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px;
  padding: 0 9px; border: 0; border-radius: 12px; background: none; font: inherit;
  font-weight: 500; color: var(--text-primary); text-align: left; text-decoration: none; cursor: pointer;
  transition: background-color var(--sb-hover) ease-out; }
.sb-mod > * { transition: translate var(--sb-hover) ease-out, opacity var(--sb-dur) ease-out; }
.sb-box { flex: none; display: grid; place-items: center; width: 34px; height: 34px;
  border-radius: 11px; background: var(--sb-box); border: 1px solid var(--sb-line); color: var(--text-secondary);
  transition: translate var(--sb-hover) ease-out, background-color var(--sb-hover) ease-out,
    border-color var(--sb-hover) ease-out, color var(--sb-hover) ease-out; }
.sb-box .icon { width: 18px; height: 18px; }
.sb-label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden; }
.sb-text { flex: 1; min-width: 0; display: grid; white-space: nowrap; overflow: hidden; }
.sb-text small { font-size: 12px; font-weight: 400; color: var(--text-secondary); }
.sb-chev { color: var(--text-secondary); transition: rotate var(--sb-dur) ease-out; }
.sb-mod[aria-expanded="true"] .sb-chev { rotate: 180deg; }

@media (hover: hover) and (pointer: fine) {
  .sb-mod:hover > * { translate: var(--sb-shift) 0; }
  .sb-mod:hover .sb-box { border-color: var(--color-primary); color: var(--color-primary); }
}
.sb-item:has([aria-current="page"]) > .sb-mod { background: var(--sb-tint); }
.sb-item:has([aria-current="page"]) > .sb-mod .sb-box {
  background: var(--color-primary); border-color: var(--color-primary); color: var(--on-primary); }

/* Submódulos con guía de árbol, centrada bajo la caja (9 + 17 = 26px) */
.sb-pop { display: contents; }
.sb-mod[aria-expanded="false"] + .sb-pop { display: none; }
.sb-sub { margin: 2px 0 6px; padding-left: 26px; }
.sb-sub > li { position: relative; padding-left: 18px; }
.sb-sub > li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--sb-line); }
.sb-sub > li:last-child::before { bottom: 50%; }
.sb-sub > li::after { content: ""; position: absolute; left: 0; top: 50%; width: 10px; height: 1px; background: var(--sb-line); }
.sb-sub > li:has([aria-current="page"])::after { width: 14px; background: var(--color-primary); }
.sb-sub a { display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 12px;
  color: var(--text-secondary); text-decoration: none; transition: color var(--sb-hover) ease-out; }
.sb-sub a[aria-current="page"] { color: var(--color-primary); background: var(--sb-tint); }
.sb-sub__title { display: none; }

/* Contraído */
.sb[data-collapsed="true"] .sb-label { opacity: 0; }
.sb[data-collapsed="true"] .sb-pop, .sb-fly { display: none; position: absolute; left: 100%; top: 0; z-index: 20; padding-left: 20px; }
.sb-user > .sb-fly { top: auto; bottom: 0; }
@media (hover: hover) and (pointer: fine) {
  .sb[data-collapsed="true"] .sb-item:hover > .sb-pop, .sb-user:not(.is-open):hover > .sb-fly { display: block; }
  .sb-sub a:hover { color: var(--text-primary); }
  .sb-sub a[aria-current="page"]:hover { color: var(--color-primary); }
}
.sb[data-collapsed="true"] .sb-item:focus-within > .sb-pop { display: block; }

/* Flotantes y ventana */
.sb-panel, .sb[data-collapsed="true"] .sb-sub { min-width: 200px; margin: 0; padding: 6px; border-radius: 12px;
  background: var(--surface); box-shadow: var(--shadow-hover); }
.sb[data-collapsed="true"] .sb-sub > li { padding-left: 0; }
.sb[data-collapsed="true"] .sb-sub > li::before, .sb[data-collapsed="true"] .sb-sub > li::after { content: none; }
.sb[data-collapsed="true"] .sb-sub a { border-radius: 6px; }
.sb-panel__title, .sb[data-collapsed="true"] .sb-sub__title { display: block; margin: 0; padding: 8px 10px 6px;
  font-size: 13px; font-weight: 600; color: var(--text-primary); }
.sb-opt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 10px;
  border: 0; border-radius: 6px; background: none; font: inherit; color: var(--text-primary);
  text-align: left; text-decoration: none; cursor: pointer; transition: background-color var(--sb-hover) ease-out; }
.sb-opt--danger { color: var(--color-danger); }
@media (hover: hover) and (pointer: fine) { .sb-opt:hover { background: var(--surface-sunken); } }

/* Usuario */
.sb-user { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--divider); }
.sb-avatar { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
  background: var(--sb-tint); color: var(--color-primary); font-size: 13px; font-weight: 600; overflow: hidden; }
.sb-avatar--lg { width: 56px; height: 56px; font-size: 18px; }
.sb-card { position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 30; width: 272px; }
.sb-card[hidden] { display: none; }
.sb-card__head { display: flex; align-items: center; gap: 12px; padding: 10px; }
.sb-card__head p { margin: 0; }
.sb-card__name { font-weight: 600; color: var(--text-primary); }
.sb-card__mail { font-size: 13px; color: var(--text-secondary); }
.sb-card__role { margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--color-primary); }
.sb-card__rows { display: grid; gap: 8px; margin: 0 0 6px; padding: 10px; border-block: 1px solid var(--divider); font-size: 13px; }
.sb-card__rows div { display: flex; justify-content: space-between; gap: 12px; }
.sb-card__rows dt { color: var(--text-secondary); }
.sb-card__rows dd { margin: 0; color: var(--text-primary); font-weight: 500; }
</style>
<script>
// Iconos de la Regla 12. Los de módulo se agregan antes de usarlos: ICONOS.ventas = '<path d="…"/>'.
const ICONOS = {
  descargar: '<path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/><g class="i-mueve"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/></g>',
  subir: '<path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/><g class="i-mueve"><path d="M12 15V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/></g>',
  guardar: '<path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 3v4h7"/><path class="i-dibuja" pathLength="1" d="M7 21v-6a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v6"/>',
  eliminar: '<g class="i-tapa"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></g><path d="m6 7 1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M10 11v6m4-6v6"/>',
  aprobar: '<circle cx="12" cy="12" r="9"/><path class="i-dibuja" pathLength="1" d="m8.5 12.5 2.5 2.5 4.5-5"/>',
  rechazar: '<circle cx="12" cy="12" r="9"/><path class="i-gira" d="m9 9 6 6m0-6-6 6"/>',
  publicar: '<path d="M4 9.5h3l7-4v13l-7-4H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1z"/><path d="M7 14.5V19a1.5 1.5 0 0 0 3 0v-2.8"/><path class="i-onda" d="M17 9.5a3.5 3.5 0 0 1 0 5"/><path class="i-onda" d="M19.5 7a7 7 0 0 1 0 10"/>',
  enviar: '<g class="i-vuela"><path d="M21 3 3 10.5l7.5 3 3 7.5z"/><path d="m10.5 13.5 5-5"/></g>',
  ia: '<path class="i-pulso" d="M11 4.5 12.6 9l4.4 1.5-4.4 1.5-1.6 4.5L9.4 12 5 10.5 9.4 9z"/><path class="i-pulso" d="M18 3v4m-2-2h4"/><path class="i-pulso" d="M5.5 16.5v3M4 18h3"/>',
  anillo: '<circle cx="12" cy="12" r="9" opacity=".25"/><path d="M21 12a9 9 0 0 0-9-9"/>',
  contraer: '<path d="m14.5 7-5 5 5 5"/>',
  desplegar: '<path d="m7 10 5 5 5-5"/>',
  perfil: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  preferencias: '<path d="M4 6h9m4 0h3M4 12h3m4 0h9M4 18h11m4 0h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  salir: '<path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="m15 8 4 4-4 4M19 12H9"/>',
};
function icono(nombre, clase = '') {
  if (!(nombre in ICONOS)) console.warn('Falta el icono', nombre);
  return `<svg class="icon i-${nombre}${clase && ' ' + clase}" viewBox="0 0 24 24" aria-hidden="true">${ICONOS[nombre] || ''}</svg>`;
}
// Envuelve cualquier acción que tarda. Ignora clics y teclado mientras dura.
async function conProceso(boton, accion) {
  if (boton.getAttribute('aria-busy') === 'true') return;
  boton.setAttribute('aria-busy', 'true');
  boton.setAttribute('aria-disabled', 'true');
  try { return await accion(); }
  finally { boton.removeAttribute('aria-busy'); boton.removeAttribute('aria-disabled'); }
}

// Botón con proceso (Regla 11). Un icono del catálogo se anima; con un icono propio, el anillo toma
// su lugar; sin icono, el anillo va dentro del texto ocupado.
const ICONOS_ANIMADOS = ['descargar', 'subir', 'guardar', 'eliminar', 'aprobar', 'rechazar', 'publicar', 'enviar', 'ia'];
function btnProceso({ texto, gerundio, icono: ic, clase = '', tipo = 'button', attrs = '' }) {
  const textos = (anillo = '') =>
    `<span class="btn__idle">${texto}</span><span class="btn__busy">${anillo}${gerundio}</span>`;
  const cuerpo = !ic ? `<span class="btn__text btn__text--centro">${textos(icono('anillo'))}</span>`
    : ICONOS_ANIMADOS.includes(ic) ? `${icono(ic)}<span class="btn__text">${textos()}</span>`
    : `<span class="btn__icon">${icono(ic)}${icono('anillo')}</span><span class="btn__text">${textos()}</span>`;
  return `<button class="btn${clase && ' ' + clase}" type="${tipo}"${attrs && ' ' + attrs}>${cuerpo}</button>`;
}
// Menú lateral (Regla 13). Se vuelve a llamar al cambiar de rol; marcar(href) activa la vista actual.
function menuLateral(nav, { modulos, usuario, actual = location.hash }) {
  const e = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
  const id = nav.id || 'sb';
  const contraido = nav.dataset.collapsed === 'true';
  nav.classList.add('sb');
  nav.dataset.collapsed = contraido;
  if (!nav.hasAttribute('aria-label')) nav.setAttribute('aria-label', 'Menú principal');
  const ini = e(usuario.nombre.split(/\s+/).slice(0, 2).map((p) => p[0]).join('').toUpperCase());
  const opciones = `<a class="sb-opt" href="${e(usuario.perfil || '#')}">${icono('perfil')}Mi perfil</a>`
    + `<a class="sb-opt" href="${e(usuario.preferencias || '#')}">${icono('preferencias')}Preferencias</a>`
    + `<button class="sb-opt sb-opt--danger" type="button" data-salir>${icono('salir')}Cerrar sesión</button>`;
  const filas = [['Área', usuario.area], ['Cargo', usuario.cargo], ['Último acceso', usuario.acceso]]
    .filter(([, v]) => v).map(([k, v]) => `<div><dt>${k}</dt><dd>${e(v)}</dd></div>`).join('');
  const modulo = (m, i) => m.sub
    ? `<li class="sb-item"><button class="sb-mod sb-grupo" type="button" aria-expanded="false" aria-controls="${id}-sub-${i}">`
      + `<span class="sb-box">${icono(m.icono)}</span><span class="sb-label"><span class="sb-text">${e(m.texto)}</span>${icono('desplegar', 'sb-chev')}</span></button>`
      + `<div class="sb-pop"><ul class="sb-sub" id="${id}-sub-${i}"><li class="sb-sub__title" aria-hidden="true">${e(m.texto)}</li>`
      + m.sub.map((s) => `<li><a href="${e(s.href)}">${e(s.texto)}</a></li>`).join('') + '</ul></div></li>'
    : `<li class="sb-item"><a class="sb-mod" href="${e(m.href)}"><span class="sb-box">${icono(m.icono)}</span>`
      + `<span class="sb-label"><span class="sb-text">${e(m.texto)}</span></span></a></li>`;
  nav.innerHTML = `<button class="sb-toggle" type="button" aria-label="${contraido ? 'Expandir' : 'Contraer'} menú" aria-expanded="${!contraido}">${icono('contraer')}</button>`
    + `<ul class="sb-list">${modulos.map(modulo).join('')}</ul><div class="sb-user">`
    + `<button class="sb-mod sb-user__btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="${id}-card"><span class="sb-avatar">${ini}</span>`
    + `<span class="sb-label"><span class="sb-text"><b>${e(usuario.nombre)}</b><small>${e(usuario.rol)}</small></span></span></button>`
    + `<div class="sb-fly"><div class="sb-panel"><p class="sb-panel__title">${e(usuario.nombre)}</p>${opciones}</div></div>`
    + `<div class="sb-card sb-panel" id="${id}-card" role="dialog" aria-label="Cuenta" hidden><div class="sb-card__head"><span class="sb-avatar sb-avatar--lg">${ini}</span>`
    + `<div><p class="sb-card__name">${e(usuario.nombre)}</p><p class="sb-card__mail">${e(usuario.correo)}</p><p class="sb-card__role">${e(usuario.rol)}</p></div></div>`
    + `${filas && `<dl class="sb-card__rows">${filas}</dl>`}${opciones}</div></div>`;

  const toggle = nav.querySelector('.sb-toggle');
  toggle.addEventListener('click', () => {
    const contraer = nav.dataset.collapsed !== 'true';
    nav.dataset.collapsed = contraer;
    toggle.setAttribute('aria-expanded', !contraer);
    toggle.setAttribute('aria-label', contraer ? 'Expandir menú' : 'Contraer menú');
  });
  nav.querySelectorAll('.sb-grupo').forEach((btn) => {
    const sub = btn.parentElement.querySelector('.sb-sub');
    btn.addEventListener('click', () => {
      if (nav.dataset.collapsed === 'true') return sub.querySelector('a').click(); // primer submódulo
      btn.setAttribute('aria-expanded', btn.getAttribute('aria-expanded') !== 'true');
    });
  });

  const user = nav.querySelector('.sb-user');
  const userBtn = user.querySelector('.sb-user__btn');
  const card = user.querySelector('.sb-card');
  const abrirCard = (abrir) => {
    card.hidden = !abrir;
    user.classList.toggle('is-open', abrir);
    userBtn.setAttribute('aria-expanded', abrir);
  };
  userBtn.addEventListener('click', () => abrirCard(card.hidden));
  user.querySelectorAll('[data-salir]').forEach((b) => b.addEventListener('click', () => usuario.alSalir?.()));
  if (!nav._sb) { // oyentes del documento, una sola vez por menú
    document.addEventListener('click', (ev) => nav._sb.fuera(ev));
    document.addEventListener('keydown', (ev) => nav._sb.tecla(ev));
  }
  nav._sb = {
    fuera: (ev) => { if (!user.contains(ev.target)) abrirCard(false); },
    tecla: (ev) => { if (ev.key === 'Escape' && !card.hidden) { abrirCard(false); userBtn.focus(); } },
  };

  const marcar = (href) => {
    nav.querySelectorAll('[aria-current]').forEach((a) => a.removeAttribute('aria-current'));
    const link = [...nav.querySelectorAll('.sb-list a')]

/* Simula la redacción del agente, en registro formal de informe médico. Sin comparación habla solo del período; con ella, lo contrasta. */
const dDia = (s) => `${DIAS_L[fch(s).getDay()]} ${fch(s).getDate()}`;
const fechasTxt = (f) => f.length > 6 ? `entre el ${dDia(f[0])} y el ${dDia(f[f.length - 1])}` : unir(f.map(dDia));
const intensidadTxt = (x) => !x.ints.size ? '' : x.ints.size === 1 ? ` de intensidad ${[...x.ints][0]}` : ` de intensidad variable (${unir([...x.ints])})`;
function redactar(pac, desde, hasta, comp) {
  const total = largo(desde, hasta), act = regsRango(pac, desde, hasta), a = porSintoma(act), cl = [];
  const ant = comp ? regsRango(pac, comp.desde, comp.hasta) : [], p = porSintoma(ant), conComp = comp && ant.length > 0;
  const nuevos = [], sueltos = [];
  // el hallazgo principal primero (el que más episodios tiene)
  Object.entries(a).sort((u, v) => v[1].veces - u[1].veces).forEach(([n, x]) => {
    const nl = n.toLowerCase(), veces = x.veces > x.dias ? `, con un total de ${x.veces} episodios` : '';
    const frase = `${nl}${intensidadTxt(x)} en ${nDias(x)} (${fechasTxt(x.fechas)})${veces}`;
    if (conComp && p[n]) cl.push({ texto: `${cl.length ? 'Asimismo, hubo' : 'Hubo'} registro de ${frase}, frente a ${nDias(p[n])} en el período de comparación.`, fuentes: x.ids });
    else { sueltos.push({ frase, ids: x.ids }); if (conComp) nuevos.push([nl, x.ids]); }
  });
  if (sueltos.length) {
    const [primero, ...resto] = sueltos;
    if (!cl.length) { cl.push({ texto: `Hubo registro de ${primero.frase}.`, fuentes: primero.ids }); }
    else resto.unshift(primero);
    if (resto.length) cl.push({ texto: `${cl.length ? 'Asimismo, hubo' : 'Hubo'} registro ${unir(resto.map((r) => 'de ' + r.frase))}.`, fuentes: resto.flatMap((r) => r.ids) });
  }
  if (nuevos.length) cl.push({ texto: `No se habían registrado en el período de comparación: ${unir(nuevos.map((x) => x[0]))}.`, fuentes: ['sinsint:' + comp.desde + '|' + comp.hasta + '|' + ant.length],
    patron: true, patronTxt: `Se observa la aparición de ${unir(nuevos.map((x) => x[0]))} en el período evaluado, sin antecedente en el período de comparación.` });
  if (conComp) Object.entries(p).forEach(([n, x]) => { if (!a[n]) cl.push({ texto: `No hubo registro de ${n.toLowerCase()} en el período evaluado, a diferencia del período de comparación (${nDias(x)}).`, fuentes: x.ids }); });
  if (act.length && !Object.keys(a).length) cl.push({ texto: 'No hubo registro de síntomas en el período evaluado.', fuentes: act.map((r) => r.id) });
  const faltan = Array.from({ length: total }, (_, o) => sumar(desde, o)).filter((f) => !act.some((r) => r.fecha === f));

  if (comp && !ant.length) cl.push({ texto: 'No se dispone de registros del período de comparación, por lo que no es posible contrastar ambos períodos.', fuentes: ['comp:' + comp.desde + '|' + comp.hasta] });

const SINTOMAS_DET = [
  ['Vómito', /vomit/], ['Diarrea', /diarre/], ['Náuseas', /náuseas/], ['Fiebre', /fiebre/], ['Mareo', /mareo|maread/],
  ['Dolor de cabeza', /dolor de cabeza|cefale|duele la cabeza/], ['Dolor de hueso', /dolor(es)? (de|en los) huesos?|duelen los huesos/],
  ['Apetito bajo', /comió poco|no quiso comer|sin apetito|rechaz/], ['Ánimo decaído', /decaíd|triste|desanimad/],
];

/* Simula a la IA: corrige la redacción y detecta síntomas con nombre del catálogo, sin casillas fijas */
function interpretar(raw) {
  let t = raw.trim().replace(/\s+/g, ' ');
  t = t.replace(/\b(?:gomit|bomit|vomit)\w*/gi, 'Vomitó').replace(/\b(?:diarea|dearrea|diarrea)\b/gi, 'diarrea').replace(/\bnauseas\b/gi, 'náuseas')
    .replace(/\bcabesa\b/gi, 'cabeza').replace(/\banimo\b/gi, '. Ánimo').replace(/\btuvo\b/gi, '. Tuvo').replace(/\bcomi[oó] (?:poko|poco)\b/gi, '. Comió poco')
    .replace(/\bcomi[oó] (bien|todo|completo)\b/gi, '. Comió $1').replace(/\bdecaid[oa]\b/gi, '. Decaído')
    .replace(/\s+\./g, '.').replace(/^\.\s*/, '').replace(/\.+/g, '.');
  t = t.charAt(0).toUpperCase() + t.slice(1);
  if (!/[.!?]$/.test(t)) t += '.';
  const sintomas = [];
  t.split(/(?<=[.!?])\s+/).forEach((f) => {
    const l = f.toLowerCase();
    SINTOMAS_DET.forEach(([n, re]) => {
      if (!re.test(l) || sintomas.some((s) => s.n === n)) return;
      const veces = /\b(dos|2) veces/.test(l) ? 2 : /\b(tres|3) veces/.test(l) ? 3 : /\buna vez/.test(l) ? 1 : 0;
      const intensidad = /intens|fuerte|severo/.test(l) ? 'intenso' : /moderad/.test(l) ? 'moderado' : /leve|ligero/.test(l) ? 'leve' : '';
      sintomas.push({ n, veces, intensidad });
    });
  });
  return { texto: t, sintomas };
}

    errT.textContent = texto ? '' : 'El registro no puede quedar vacío.';
    errS.textContent = new Set(sintomas.map((s) => s.n)).size < sintomas.length ? 'Hay un síntoma repetido. Déjelo una sola vez.' : '';
    errF.textContent = !fecha ? 'Elija la fecha del registro.' : DATOS.registros.some((x) => x.pac === pac && x.fecha === fecha) ? 'Ese paciente ya tiene un registro en esa fecha.' : '';
    if (errT.textContent || errS.textContent || errF.textContent) return;
    conProceso(e.currentTarget, async () => {
      await sleep(900);
      DATOS.registros.push({ id: 'R' + ++_r, pac, fecha, texto, sintomas });
      nuevos.forEach((n) => DATOS.catalogo.push(n));
      DATOS.notificaciones.unshift({ id: 'N' + Date.now(), pac, tipo: 'registro', texto: `Nuevo registro del ${dLargo(fecha)}`, ref: `#/med/pacientes/ficha/${pac}`, hora: '26 oct, ahora', leida: false });
      c.replaceWith(nodo(`<div class="aviso">${icono('aprobar')}<span>Registro guardado. Se notificó al médico.${nuevos.length ? ` Síntoma nuevo en el catálogo: ${esc(unir(nuevos))}.` : ''} <a href="#/enf/pacientes/ficha/${pac}">Ver ficha del paciente</a></span></div>`).firstChild);
      pintarCampana();
    });
  });
  return c;
}

/* ---------- informes ---------- */
function hojaHTML(inf) {
  const sem = largo(inf.desde, inf.hasta) === 7, total = largo(inf.desde, inf.hasta), comp = inf.comp;
  const act = regsRango(inf.pac, inf.desde, inf.hasta), ant = comp ? regsRango(inf.pac, comp.desde, comp.hasta) : [];
  const a = porSintoma(act), p = porSintoma(ant);
  const fuente = (f) => f.startsWith('falta:') ? `${dCorto(f.slice(6))}: sin registro`
    : f.startsWith('sinsint:') ? (([d, h, n]) => `Período de comparación (${periodoTxt(d, h)}): ${n} registros revisados, sin estas manifestaciones`)(f.slice(8).split('|'))
    : f.startsWith('comp:') ? `Período de comparación (${periodoTxt(...f.slice(5).split('|'))}): sin registros`
    : (() => { const r = DATOS.registros.find((x) => x.id === f); return `${dCorto(r.fecha)}: "${esc(r.texto)}"`; })();
  const celda = (x) => x ? nDias(x) + (x.veces > x.dias ? `, ${x.veces} veces` : '') : 'No registrado';
  const fila = (n, va, vm) => comp ? `<tr><td>${n}</td><td>${va}</td><td>${vm}</td></tr>` : `<tr><td>${n}</td><td>${vm}</td></tr>`;
  const nombres = comp ? [...new Set([...Object.keys(a), ...Object.keys(p)])] : Object.keys(a);
  const sinDatos = comp && !ant.length;
  const intro = `Respecto del paciente ${inf.pac}, en el período del ${periodoTxt(inf.desde, inf.hasta)} se dispone de registros de ${act.length} de ${total} días${comp ? `; el análisis se contrasta con el período del ${periodoTxt(comp.desde, comp.hasta)}` : ''}.`;
  const filas = fila('Días con registro', comp ? (sinDatos ? 'Sin datos' : `${ant.length} de ${largo(comp.desde, comp.hasta)}`) : '', `${act.length} de ${total}`)
    + (nombres.length ? nombres.map((n) => fila(esc(n), sinDatos ? 'Sin datos' : celda(p[n]), celda(a[n]))).join('') : fila('Síntomas', sinDatos ? 'Sin datos' : 'Ninguno', 'Ninguno'));
  const patron = inf.claims.map((c, i) => ({ c, i })).filter((x) => x.c.patron);
  const aprob = inf.tmp ? 'no aplica, es una consulta del médico' : inf.aprobador ? esc(inf.aprobador) : 'pendiente de aprobación';
  const pie = inf.tmp ? 'Generado con IA a partir de registros aprobados por enfermería. No forma parte del historial oficial. No contiene diagnóstico ni recomendación de tratamiento.'
    : 'Describe la evolución documentada. No contiene diagnóstico ni recomendación de tratamiento.';
  return `<article class="hoja" id="hoja"><h1>Informe de seguimiento ${sem ? 'semanal' : 'del período'}</h1><p class="sub">Paciente ${inf.pac}, ${sem ? 'semana' : 'período'} del ${periodoTxt(inf.desde, inf.hasta)}</p>`
    + `<div class="meta"><span><b>Comparado con:</b> ${comp ? periodoTxt(comp.desde, comp.hasta) : 'sin comparación'}</span><span><b>Registros revisados:</b> ${act.length} de ${total} días</span>`
    + `<span><b>Generado:</b> ${dFull(inf.generado)}</span><span><b>Aprobado por:</b> ${aprob}</span></div>`
    + `<h2>Resumen de la evolución</h2><p class="resumen">${esc(intro)} ${inf.claims.map((c, i) => `<span class="txt" data-i="${i}">${esc(c.texto)}</span><sup>[${i + 1}]</sup>`).join(' ')}</p>`
    + `<h2>Cifras ${sem ? 'de la semana' : 'del período'}</h2><table><tr><th>Síntoma</th>${comp ? '<th>Período de comparación</th>' : ''}<th>${sem ? 'Esta semana' : 'Este período'}</th></tr>${filas}`
    + `</table><p class="nota">Cifras calculadas por el sistema a partir de los registros, no por la IA. ${comp ? 'Solo se listan los síntomas que aparecieron en alguno de los dos períodos.' : 'Solo se listan los síntomas que aparecieron en el período.'}</p>`
    + (patron.length ? `<h2>Patrón a destacar</h2><p class="resumen">${esc(patron[0].c.patronTxt || patron[0].c.texto)}<sup>[${patron[0].i + 1}]</sup></p>` : '')
    + `<h2>Fuentes (registros originales)</h2><ol>${inf.claims.map((c, i) => `<li>[${i + 1}] ${c.fuentes.map(fuente).join(' / ')}</li>`).join('')}</ol>`
    + `<div class="pie"><span>${pie}</span><span>Revisado por: <b>${inf.tmp ? 'el médico que lo solicita' : inf.aprobador ? esc(inf.aprobador) : 'pendiente'}</b></span></div></article>`;
}

function vInfVer(rol, id) {
  const inf = TEMP[id] || DATOS.informes.find((i) => i.id === id);
  if (!inf || (rol === 'med' && !inf.tmp && inf.estado !== 'Enviado') || (rol !== 'med' && inf.tmp)) return noEncontrado();
  const btn = (texto, gerundio, ic, clase, act) => btnProceso({ texto, gerundio, icono: ic, clase, attrs: `data-a="${act}"` });
  const nota = inf.tmp ? 'Consulta personal: se arma con registros que enfermería ya aprobó. No se guarda en el historial ni se envía a nadie.'
    : { 'En revisión': 'Revise el texto y las fuentes. Al aprobar, el informe queda guardado, pero todavía no llega al médico.',
      Aprobado: 'Informe guardado. Puede descargarlo o enviarlo al médico.', Enviado: `Enviado al médico el ${dFull(inf.enviado || HOY)}.` }[inf.estado];
  let botones = '';
  if (rol === 'enf') {
    if (inf.estado === 'En revisión') botones = '<button class="btn btn--sec" type="button" data-a="editar">Editar texto</button>' + btn('Aprobar informe', 'Aprobando', 'aprobar', 'btn--primary', 'aprobar');
    else if (inf.estado === 'Aprobado') botones = btn('Descargar PDF', 'Descargando', 'descargar', 'btn--sec', 'descargar') + btn('Enviar al médico', 'Enviando', 'enviar', 'btn--primary', 'enviar');
    else botones = btn('Descargar PDF', 'Descargando', 'descargar', 'btn--sec', 'descargar');
  } else botones = btn('Descargar PDF', 'Descargando', 'descargar', 'btn--primary', 'descargar');
  const w = nodo(`<div class="acciones"><div class="izq"><b>Informe de ${inf.pac}</b><span>${inf.tmp ? '<span class="sec">Consulta del médico</span>' : estado(inf.estado)}</span></div>${botones}${rol === 'enf' || inf.tmp ? `<p class="nota">${nota}</p>` : ''}</div>`
    + (rol === 'enf' && inf.estado === 'En revisión' ? `<div class="aviso">${icono('ia')}<span>Esta es la vista previa tal como la verá el médico. La redactó la IA a partir de los registros; usted decide si se aprueba.</span></div>` : '')
    + hojaHTML(inf));
  const on = (a, fn) => w.querySelector(`[data-a="${a}"]`)?.addEventListener('click', fn);
  on('editar', (e) => {
    const b = e.currentTarget, activar = b.textContent === 'Editar texto';
    w.querySelectorAll('.txt').forEach((s) => { s.contentEditable = activar; });
    if (!activar) w.querySelectorAll('.txt').forEach((s) => { inf.claims[+s.dataset.i].texto = s.textContent.trim(); });
    b.textContent = activar ? 'Listo' : 'Editar texto';
  });
  on('aprobar', (e) => conProceso(e.currentTarget, async () => {
    w.querySelectorAll('.txt').forEach((s) => { inf.claims[+s.dataset.i].texto = s.textContent.trim(); });
    await sleep(900); inf.estado = 'Aprobado'; inf.aprobador = ROLES.enf.usuario.nombre; toast('Informe aprobado y guardado'); ruta();
  }));
  on('descargar', (e) => conProceso(e.currentTarget, async () => { await sleep(700); window.print(); }));
  on('enviar', (e) => conProceso(e.currentTarget, async () => {
    await sleep(900); inf.estado = 'Enviado'; inf.enviado = HOY;
    DATOS.notificaciones.unshift({ id: 'N' + Date.now(), pac: inf.pac, tipo: 'informe', texto: 'Informe recibido', ref: `#/med/informes/ver/${inf.id}`, hora: '26 oct, ahora', leida: false });
    toast('Informe enviado. Se notificó al médico'); ruta();
  }));
  return { titulo: inf.tmp ? 'Informe de consulta' : 'Informe de seguimiento', nodo: w,
    marcar: rol === 'enf' ? (inf.estado === 'En revisión' ? '#/enf/informes/revision' : '#/enf/informes/aprobados') : inf.tmp ? '#/med/informes/armar' : '#/med/informes/lista' };
}

function vInfGenerar(rol, id) {
  const pacs = DATOS.pacientes.map((p) => `<option value="${p.id}"${p.id === (id || 'P-014') ? ' selected' : ''}>${p.id} (cama ${p.cama})</option>`).join('');
  const sems = ['2026-10-19', '2026-10-12', '2026-10-05'].map((s) => `<option value="${s}">Del ${rango(s)}</option>`).join('');
  const meses = [['2026-10', 'octubre de 2026'], ['2026-09', 'septiembre de 2026']].map(([m, t]) => `<option value="${m}">${t}</option>`).join('');
  const intro = rol === 'med' ? 'Arme su propio informe de un paciente para el período que elija. Se hace con los registros que enfermería ya aprobó y es solo para su consulta: no se guarda en el historial.'
    : 'Elija el paciente y el período. El informe habla solo de ese período; si quiere, puede compararlo con otro.';
  const w = nodo(`<div class="chat-pag"><p class="sec">${intro}</p>`
    + `<div class="chat-datos"><div class="campo"><label for="ig-pac">Paciente</label><select class="inp" id="ig-pac">${pacs}</select></div>`
    + `<div class="campo"><label for="ig-tipo">Período del informe</label><select class="inp" id="ig-tipo"><option value="semana">Una semana</option><option value="mes">Un mes</option><option value="rango">Rango de fechas</option></select></div></div>`
    + `<div class="campo" id="ig-semana"><label for="ig-sem">Semana</label><select class="inp" id="ig-sem">${sems}</select></div>`
    + `<div class="campo" id="ig-mes" hidden><label for="ig-m">Mes</label><select class="inp" id="ig-m">${meses}</select></div>`
    + `<div class="chat-datos" id="ig-rango" hidden><div class="campo"><label for="ig-d">Desde</label><input class="inp" type="date" id="ig-d" value="2026-10-12" max="${HOY}"></div>`
    + `<div class="campo"><label for="ig-h">Hasta</label><input class="inp" type="date" id="ig-h" value="2026-10-25" max="${HOY}"></div></div>`
    + `<div class="campo"><label for="ig-cmp">Comparar con</label><select class="inp" id="ig-cmp"><option value="no">No comparar, solo este período</option>`
    + `<option value="ant">El período anterior (misma duración)</option><option value="otro">Otro período que yo elija</option></select></div>`
    + `<div class="chat-datos" id="ig-cmp-rango" hidden><div class="campo"><label for="ig-cd">Comparar desde</label><input class="inp" type="date" id="ig-cd" value="2026-10-05" max="${HOY}"></div>`
    + `<div class="campo"><label for="ig-ch">Comparar hasta</label><input class="inp" type="date" id="ig-ch" value="2026-10-11" max="${HOY}"></div></div>`
    + `<span class="error" id="ig-err"></span>`
    + `<div>${btnProceso({ texto: 'Generar con IA', gerundio: 'Generando', icono: 'ia', clase: 'btn--primary', attrs: 'id="ig-btn"' })}</div></div>`);
  const q = (s) => w.querySelector(s);
  q('#ig-tipo').addEventListener('change', () => {
    const t = q('#ig-tipo').value;
    q('#ig-semana').hidden = t !== 'semana'; q('#ig-mes').hidden = t !== 'mes'; q('#ig-rango').hidden = t !== 'rango';
  });
  q('#ig-cmp').addEventListener('change', () => { q('#ig-cmp-rango').hidden = q('#ig-cmp').value !== 'otro'; });
  const periodo = () => {
    const t = q('#ig-tipo').value;
    if (t === 'semana') { const d = q('#ig-sem').value; return { desde: d, hasta: sumar(d, 6) }; }
    if (t === 'mes') { const [y, m] = q('#ig-m').value.split('-').map(Number); const fin = isoDe(new Date(y, m, 0)); return { desde: `${y}-${String(m).padStart(2, '0')}-01`, hasta: fin > HOY ? HOY : fin }; }
    const d = q('#ig-d').value, h = q('#ig-h').value;
    if (!d || !h) return { error: 'Elija las dos fechas.' };
    if (d > h) return { error: 'La fecha inicial no puede ser posterior a la final.' };
    if (h > HOY) return { error: 'La fecha final no puede ser futura.' };
    if (largo(d, h) > 366) return { error: 'El rango no puede pasar de un año.' };
    return { desde: d, hasta: h };
  };
  const comparacion = (per) => {
    const t = q('#ig-cmp').value;
    if (t === 'no') return { comp: null };
    if (t === 'ant') { const [d, h] = anterior(per.desde, per.hasta); return { comp: { desde: d, hasta: h } }; }
    const d = q('#ig-cd').value, h = q('#ig-ch').value;
    if (!d || !h) return { error: 'Elija las dos fechas del período de comparación.' };
    if (d > h) return { error: 'En la comparación, la fecha inicial no puede ser posterior a la final.' };
    if (h > HOY) return { error: 'El período de comparación no puede ser futuro.' };
    if (d <= per.hasta && h >= per.desde) return { error: 'El período de comparación no puede cruzarse con el período del informe.' };
    return { comp: { desde: d, hasta: h } };
  };
  q('#ig-btn').addEventListener('click', (e) => {
    const per = periodo(), err = q('#ig-err'), pac = q('#ig-pac').value;
    const cmp = per.error ? {} : comparacion(per);
    err.textContent = per.error || cmp.error || '';
    if (err.textContent) return;
    if (!regsRango(pac, per.desde, per.hasta).length) { err.textContent = 'Ese paciente no tiene registros en ese período, no hay con qué generar el informe.'; return; }
    const ya = rol === 'enf' && DATOS.informes.find((i) => i.pac === pac && i.desde === per.desde && i.hasta === per.hasta && JSON.stringify(i.comp) === JSON.stringify(cmp.comp));
    if (ya) { toast('Ya existe un informe igual'); location.hash = `#/enf/informes/ver/${ya.id}`; return; }
    conProceso(e.currentTarget, async () => {
      await sleep(1600);
      DATOS.trazas.unshift({ hora: '26 oct, ahora', pac, accion: 'obtener_registros, calcular_metricas' + (rol === 'enf' ? ', guardar_borrador' : ''), dur: '1.6 s', res: 'Completado' });
      if (rol === 'enf') { location.hash = `#/enf/informes/ver/${crearInforme(pac, per.desde, per.hasta, 'En revisión', cmp.comp).id}`; return; }
      const t = { id: 'M-' + (Object.keys(TEMP).length + 1), pac, desde: per.desde, hasta: per.hasta, comp: cmp.comp, tmp: true, generado: HOY, aprobador: null, claims: redactar(pac, per.desde, per.hasta, cmp.comp) };
      TEMP[t.id] = t; location.hash = `#/med/informes/ver/${t.id}`;
    });
  });
  return { titulo: rol === 'med' ? 'Armar informe' : 'Generar informe', nodo: w };
}

    ['Aprobar informe', 'Sí', 'No', 'No'], ['Usuarios', '—', '—', 'V C A E'], ['Roles y permisos', '—', '—', 'V A'], ['Trazas', '—', '—', 'V']];
  return { titulo: 'Permisos por rol', nodo: nodo(`<div class="aviso">${icono('permisos')}<span>Solo lectura en esta entrega. Aprobar un informe solo puede tenerlo Enfermería, y no se puede cambiar desde aquí. V ver, C crear, A actualizar, E eliminar.</span></div>`
    + `<div class="tabla-wrap"><table class="tabla perm"><thead><tr><th>Módulo</th><th>Enfermería</th><th>Médico</th><th>Administrador</th></tr></thead><tbody>${filas.map((f) => `<tr>${f.map((c, i) => `<td data-label="${['Módulo', 'Enfermería', 'Médico', 'Administrador'][i]}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`) };
}

function vTrazas() {
  const filas = DATOS.trazas.map((t) => ({ buscar: `${t.pac} ${t.accion}`, celdas: [t.hora, `<b>${t.pac}</b>`, esc(t.accion), t.dur, estado(t.res, true)] }));
  return { titulo: 'Trazas del agente', nodo: listado({ cols: ['Hora', 'Paciente', 'Herramientas usadas', 'Duración', 'Resultado'], filas, placeholder: 'Busque por paciente o herramienta', vacio: { titulo: 'Aún no hay trazas', texto: 'Aparecen cuando se genera el primer informe.' } }) };
}

/* ---------- campana (médico) ---------- */
function pintarCampana() {
  const c = document.getElementById('campana');
  if (rolActual !== 'med') { c.innerHTML = ''; return; }
  const abierta = c.querySelector('.campana-panel') && !c.querySelector('.campana-panel').hidden;
  const ns = DATOS.notificaciones;
  c.innerHTML = `<button class="icbtn" type="button" aria-label="Notificaciones${sinLeer() ? ', hay sin leer' : ''}" aria-expanded="${abierta}">${icono('campana')}${sinLeer() ? '<i class="punto-notif"></i>' : ''}</button>`
    + `<div class="campana-panel" ${abierta ? '' : 'hidden'}><h3>Notificaciones</h3>${ns.length ? ns.map((n) => `<button class="notif" type="button" data-id="${n.id}"><i class="pt" style="background:${n.leida ? 'transparent' : 'var(--color-primary)'}"></i><span>${esc(n.texto)}, paciente ${n.pac}<small>${n.hora}</small></span></button>`).join('') : '<p class="sec" style="padding:8px 10px">Sin notificaciones.</p>'}</div>`;
  const panel = c.querySelector('.campana-panel'), b = c.querySelector('.icbtn');
  b.addEventListener('click', (e) => { e.stopPropagation(); panel.hidden = !panel.hidden; b.setAttribute('aria-expanded', !panel.hidden); });
  panel.addEventListener('click', (e) => { const n = e.target.closest('.notif'); if (!n) return; const x = ns.find((y) => y.id === n.dataset.id); x.leida = true; location.hash = x.ref; panel.hidden = true; pintarCampana(); });
}
document.addEventListener('click', (e) => { const p = document.querySelector('.campana-panel'); if (p && !p.hidden && !e.target.closest('.campana')) { p.hidden = true; pintarCampana(); } });

/* ---------- router ---------- */
const VISTAS = {
  'enf/pacientes/lista': (id) => vPacLista('enf'), 'enf/pacientes/ficha': (id) => vPacFicha('enf', id),
  'enf/registro/nuevo': (id) => vRegNuevo('enf', id), 'enf/registro/historial': () => vRegHistorial('enf'),
  'enf/informes/generar': (id) => vInfGenerar('enf', id), 'enf/informes/revision': () => vInfLista('enf', 'revision'),
  'enf/informes/aprobados': () => vInfLista('enf', 'aprobados'), 'enf/informes/ver': (id) => vInfVer('enf', id),
  'med/pacientes/lista': () => vPacLista('med'), 'med/pacientes/ficha': (id) => vPacFicha('med', id),
  'med/informes/lista': () => vInfLista('med'), 'med/informes/armar': (id) => vInfGenerar('med', id), 'med/informes/ver': (id) => vInfVer('med', id),
  'adm/usuarios/lista': () => vUsuLista(), 'adm/usuarios/nuevo': () => vUsuForm('adm'), 'adm/usuarios/editar': (id) => vUsuForm('adm', id),
  'adm/permisos/ver': () => vPermisos(), 'adm/trazas/lista': () => vTrazas(),
};
const VISTA_DEF = { 'enf/pacientes': 'lista', 'enf/registro': 'nuevo', 'enf/informes': 'generar', 'med/pacientes': 'lista', 'med/informes': 'lista',
  'adm/usuarios': 'lista', 'adm/permisos': 'ver', 'adm/trazas': 'lista' };

const $nav = document.getElementById('sb'), $vista = document.getElementById('vista'), $titulo = document.getElementById('titulo'), $rol = document.getElementById('rol');
let rolActual = null, menu = null;
if (innerWidth < 760) $nav.dataset.collapsed = 'true';

function ruta() {
  const h = location.hash || '#/enf/pacientes';
  const [, rol, mod, vista, id] = h.split('/');
  if (!ROLES[rol]) { location.hash = '#/enf/pacientes'; return; }
  const m = mod || ROLES[rol].inicio, v = vista || VISTA_DEF[`${rol}/${m}`];
  if (rol !== rolActual) { rolActual = rol; menu = menuLateral($nav, { ...ROLES[rol], actual: h }); $rol.value = rol; }
  const fn = VISTAS[`${rol}/${m}/${v}`];
  const r = fn ? fn(id) : noEncontrado();
  $titulo.textContent = r.titulo;
  $vista.replaceChildren(r.nodo);
  menu.marcar(r.marcar || h);
  pintarCampana();
  window.scrollTo(0, 0);
}
$rol.addEventListener('change', () => { location.hash = '#/' + $rol.value; });
window.addEventListener('hashchange', ruta);
ruta();
</script>
</body>
</html>
