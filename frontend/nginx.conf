server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS; la variable evita que nginx falle al arrancar si el backend aun no existe.
    resolver 127.0.0.11 valid=10s;

    # Dictado por voz (RF-38): el audio no se guarda en ninguna parte, tampoco aqui. Por defecto nginx escribe a un archivo
    # temporal todo cuerpo de mas de 16 KB y rechaza los de mas de 1 MB. En esta ruta el cuerpo cabe entero en memoria
    # (mismo tope que DictationService.MAX_AUDIO_BYTES) y se pasa al backend a medida que llega, sin bufer en disco.
    location ~ ^/api/patients/[^/]+/entries/transcribe$ {
        client_max_body_size 5m;
        client_body_buffer_size 5m;
        client_body_in_file_only off;
        proxy_request_buffering off;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        # $http_host lleva el puerto (localhost:4201). Con $host el backend veia «localhost», el Origin del navegador
        # (http://localhost:4201) no coincidia y Spring rechazaba los POST con «Invalid CORS request» cuando run.sh
        # elegia otro puerto para el frontend. Asi la peticion sigue siendo del mismo origen, con cualquier puerto.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE (D24): los pasos deben llegar al navegador a medida que ocurren.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
