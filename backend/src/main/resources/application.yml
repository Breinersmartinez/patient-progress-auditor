spring:
  profiles:
    active: dev

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  seed:
    demo: ${APP_SEED_DEMO:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Capa de proveedor del LLM (docs/decisiones.md, E8). Las llaves vienen del entorno y nunca llevan valor por defecto.
llm:
  primary: ${LLM_PROVIDER:groq}
  fallback: ${LLM_FALLBACK:gemini}
  groq:
    api-key: ${GROQ_API_KEY:}
    agent-model: ${GROQ_MODEL:openai/gpt-oss-120b}
    structuring-model: ${GROQ_STRUCTURING_MODEL:openai/gpt-oss-120b}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}

# Limites del agente (AGENTS.md; valores y razon en docs/decisiones.md). Cambiarlos por variable fuerza cada limite en la
# demo sin simular nada: por ejemplo AGENT_MAX_ITERATIONS=1.
agent:
  max-iterations: ${AGENT_MAX_ITERATIONS:5}
  max-tokens: ${AGENT_MAX_TOKENS:30000}
  tool-timeout: ${AGENT_TOOL_TIMEOUT_SECONDS:5}s
  tool-descriptions: ${AGENT_TOOL_DESCRIPTIONS:V2}

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
