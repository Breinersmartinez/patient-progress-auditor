name: patient-progress-auditor

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-patient_auditor}
      POSTGRES_USER: ${DB_USERNAME:-patient_auditor}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD no esta definido, ejecute ./run.sh}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Base de datos propia de Keycloak (separada de la de la aplicacion). Sin "ports": solo la ve Keycloak.
  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${KC_DB_NAME:-keycloak}
      POSTGRES_USER: ${KC_DB_USERNAME:-keycloak}
      POSTGRES_PASSWORD: "${KC_DB_PASSWORD:?KC_DB_PASSWORD no esta definido, ejecute ./run.sh}"
    volumes:
      - kcdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Inicio de sesion (docs/login-keycloak). El realm "auditor" se importa solo en el primer arranque.
  keycloak:
    build: ./keycloak
    image: patient-progress-auditor/keycloak:26.8.2
    depends_on:
      keycloak-db:
        condition: service_healthy
    command:
      - start
      - --optimized
      - --import-realm
      - --http-enabled=true
      # Tema sin cache: los cambios en ./keycloak/themes se ven al recargar el navegador.
      - --spi-theme--cache-themes=false
      - --spi-theme--cache-templates=false
      - --spi-theme--static-max-age=-1
    environment:
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: "${KC_DB_PASSWORD:?KC_DB_PASSWORD no esta definido, ejecute ./run.sh}"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD no esta definido, ejecute ./run.sh}"
      # Secreto del cliente de servicio `auditor-admin`: el realm lo toma al importarse (${...} en auditor-realm.json).
      AUDITOR_ADMIN_CLIENT_SECRET: "${AUDITOR_ADMIN_CLIENT_SECRET:?AUDITOR_ADMIN_CLIENT_SECRET no esta definido, ejecute ./run.sh}"
      # La URL publica fija el emisor de los tokens: el navegador y el backend deben verla igual.
      KC_HOSTNAME: http://localhost:${KC_PORT:-7070}
    ports:
      - "${KC_PORT:-7070}:8080"
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # La imagen no trae curl: con bash se pide el realm "auditor". Solo responde cuando el import termino (el puerto de
      # gestion /health/ready ya dice UP antes de importarlo).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /realms/auditor HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"realm\":\"auditor\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  # Buzon de correo de prueba: atrapa lo que manda Keycloak (codigo de recuperacion, invitaciones). Solo desarrollo.
  mailpit:
    image: axllent/mailpit:v1.28.0
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://db:5432/patient_auditor}
      DB_USERNAME: ${DB_USERNAME:-patient_auditor}
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD no esta definido, ejecute ./run.sh}"
      APP_SEED_DEMO: ${APP_SEED_DEMO:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_FALLBACK: ${LLM_FALLBACK:-gemini}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_STRUCTURING_MODEL: ${GROQ_STRUCTURING_MODEL:-openai/gpt-oss-120b}
      GROQ_TRANSCRIPTION_MODEL: ${GROQ_TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://us.cloud.langfuse.com}
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-demo}
      AGENT_MAX_ITERATIONS: ${AGENT_MAX_ITERATIONS:-5}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-30000}
      AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-5}
      AGENT_TOOL_DESCRIPTIONS: ${AGENT_TOOL_DESCRIPTIONS:-V2}
      # El emisor es la URL publica de Keycloak; las claves se piden por la red de Compose.
      OIDC_ISSUER: http://localhost:${KC_PORT:-7070}/realms/auditor
      OIDC_JWKS_URI: http://keycloak:8080/realms/auditor/protocol/openid-connect/certs
      # Gestion de usuarios (docs/admin-usuarios): el backend llama a la API de administracion de Keycloak por la red de
      # Compose con el cliente de servicio, y el enlace de la invitacion vuelve a la interfaz publica.
      KC_ADMIN_URL: http://keycloak:8080
      KC_ADMIN_REALM: auditor
      KC_ADMIN_CLIENT_ID: auditor-admin
      AUDITOR_ADMIN_CLIENT_SECRET: "${AUDITOR_ADMIN_CLIENT_SECRET:?AUDITOR_ADMIN_CLIENT_SECRET no esta definido, ejecute ./run.sh}"
      APP_PUBLIC_URL: http://localhost:${FRONTEND_PORT:-4200}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/system/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # nginx lo publica en /config.json para que la app sepa donde esta Keycloak sin recompilar.
      KC_PUBLIC_URL: http://localhost:${KC_PORT:-7070}
      KC_REALM: auditor
      KC_CLIENT_ID: auditor-web
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  kcdata:
